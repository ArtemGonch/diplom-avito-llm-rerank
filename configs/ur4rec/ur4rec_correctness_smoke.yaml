# CPU-capable end-to-end correctness smoke for the corrected UR4Rec pipeline.
dataset:
  name: movielens-1m
  data_dir: data/movielens-1m
  history_len: 4
  num_candidates: 10
  num_negatives_cl: 3
  train_ratio: 0.8
  val_ratio: 0.1
  split_mode: temporal_per_user
  k_core: 5
  candidate_mode: random
  max_train_users: 12
  max_val_users: 12
  max_test_users: 12
  knowledge_items_only_in_samples: true

llm:
  backend: qwen
  use_template_generator: true
  max_new_tokens: 32
  batch_size: 8
  num_shards: 1
  temperature: 0.0
  checkpoint_every: 10
  knowledge_dir: data/movielens-1m/knowledge_correctness_smoke_v2

encoder:
  model_name: bert-base-uncased
  use_hashing_encoder: true
  max_length: 64
  batch_size: 32
  freeze: true

retriever:
  num_proxies: 2
  num_layers: 1
  num_heads: 12
  dropout: 0.0
  pretrain_epochs: 1
  pretrain_lr: 1.0e-4
  alpha_cf: 1.0
  temperature: 0.05

backbone:
  name: dlcm
  hidden_dim: 768
  train_epochs: 1
  train_lr: 1.0e-4
  train_batch_size: 4

joint:
  epochs: 1
  lr: 1.0e-4
  base_loss_weight: 0.1
  patience: 1
  blend_alpha_grid: [1.0]

seed: 42
device: cpu
gpu_id: 0
cudnn_benchmark: false
tf32: false
output_dir: checkpoints/ur4rec_correctness_smoke
