# UR4Rec ML-1M corrected-v3 protocol.
#
# This is an honest corrected rerun, not a claim of paper-exact reproduction:
# - chronological train/val/test targets for every user (trained user embeddings),
# - random fixed-size candidates (MF temporal protocol is separate future work),
# - leakage-free static user profile from train history,
# - regenerated Qwen knowledge after decoder/memory/cache fixes,
# - pure UR4Rec output (blend alpha fixed at 1.0).

dataset:
  name: movielens-1m
  data_dir: data/movielens-1m
  history_len: 10
  num_candidates: 100
  num_negatives_cl: 10
  train_ratio: 0.8
  val_ratio: 0.1
  split_mode: temporal_per_user
  k_core: 5
  candidate_mode: random
  knowledge_items_only_in_samples: true

llm:
  backend: qwen
  model_name: Qwen/Qwen2.5-7B-Instruct
  use_template_generator: false
  load_in_4bit: true
  max_new_tokens: 512
  max_prompt_tokens: 1536
  batch_size: 4
  num_shards: 4
  temperature: 0.0
  checkpoint_every: 50
  knowledge_dir: data/movielens-1m/knowledge_qwen25_corrected_v3

encoder:
  model_name: bert-base-uncased
  max_length: 512
  batch_size: 64
  freeze: true

retriever:
  num_proxies: 8
  num_layers: 6
  num_heads: 12
  dropout: 0.1
  pretrain_epochs: 3
  pretrain_lr: 1.0e-4
  alpha_cf: 1.0
  temperature: 0.05

backbone:
  name: dlcm
  hidden_dim: 768
  train_epochs: 5
  train_lr: 1.0e-4
  train_batch_size: 32

joint:
  epochs: 8
  lr: 1.0e-4
  backbone_lr: 5.0e-5
  retriever_lr: 1.0e-4
  base_loss_weight: 0.1
  patience: 3
  min_delta: 0.0001
  blend_alpha_grid: [1.0]

seed: 42
device: cuda
gpu_id: 0
cudnn_benchmark: true
tf32: true
output_dir: checkpoints/ur4rec_ml1m_corrected_v3
